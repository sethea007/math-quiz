<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ប្រព័ន្ធតេស្ត និងបោះពុម្ពគណិតវិទ្យា</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX for Rendering Math -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap');
    body { font-family: 'Kantumruy Pro', sans-serif; }

    /* រចនាប័ទ្មសម្រាប់បោះពុម្ពលើក្រដាស A4 */
    @media print {
      .no-print { display: none !important; }
      body { background-color: white; color: black; }
      .print-area { shadow: none; border: none; padding: 0; width: 100%; }
      .page-break { page-break-after: always; }
      .question-card { break-inside: avoid; border: 1px solid #ccc !important; margin-bottom: 12px !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <div class="max-w-4xl mx-auto p-4">
    <!-- Header Selection (លាក់ពេល Print) -->
    <div class="bg-white rounded-2xl shadow-md p-6 mb-6 no-print">
      <h1 class="text-2xl font-bold text-indigo-700 text-center mb-6">ប្រព័ន្ធតេស្តគណិតវិទ្យា (ថ្នាក់ទី១ - ទី១២)</h1>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-sm font-semibold mb-1">១. ជ្រើសរើសថ្នាក់៖</label>
          <select id="gradeSelect" class="w-full border rounded-xl p-2.5 bg-slate-50" onchange="loadGradeLessons()">
            <option value="12">ថ្នាក់ទី ១២</option>
            <option value="11">ថ្នាក់ទី ១១</option>
            <option value="10">ថ្នាក់ទី ១០</option>
            <option value="9">ថ្នាក់ទី ៩</option>
            <option value="8">ថ្នាក់ទី ៨</option>
            <option value="7">ថ្នាក់ទី ៧</option>
            <option value="6">ថ្នាក់ទី ៦</option>
            <option value="5">ថ្នាក់ទី ៥</option>
            <option value="4">ថ្នាក់ទី ៤</option>
            <option value="3">ថ្នាក់ទី ៣</option>
            <option value="2">ថ្នាក់ទី ២</option>
            <option value="1">ថ្នាក់ទី ១</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">២. ជ្រើសរើសមេរៀន៖</label>
          <select id="lessonSelect" class="w-full border rounded-xl p-2.5 bg-slate-50">
            <option value="">កំពុងទាញយកមេរៀន...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">៣. លេខតេស្ត (១-១០០)៖</label>
          <input type="number" id="testNo" value="1" min="1" max="100" class="w-full border rounded-xl p-2.5 bg-slate-50">
        </div>
      </div>

      <div class="flex gap-3">
        <button onclick="startQuiz('online')" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition">
          💻 ធ្វើតេស្តលើបណ្តាញ (ម្ដង ១សំណួរ)
        </button>
        <button onclick="startQuiz('print')" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition">
          📄 មើលទម្រង់ A4 សម្រាប់ Print
        </button>
      </div>
    </div>

    <!-- Status Message -->
    <div id="statusMessage" class="hidden p-4 mb-6 rounded-xl text-center font-semibold no-print"></div>

    <!-- Mode 1: Interactive Quiz Panel -->
    <div id="quizContainer" class="hidden bg-white rounded-2xl shadow-md p-6 no-print">
      <div class="flex justify-between items-center border-b pb-4 mb-4">
        <div>
          <span id="quizTitle" class="font-bold text-lg text-indigo-700 block"></span>
          <p class="text-sm text-slate-500">សំណួរទី <span id="currentQNum" class="font-bold">1</span> / 100</p>
        </div>
        <div class="bg-red-50 border border-red-200 rounded-lg px-4 py-1 text-right">
          <span class="text-xs text-red-500 block">ពេលនៅសល់</span>
          <span id="timer" class="text-xl font-bold text-red-600 font-mono">30:00</span>
        </div>
      </div>

      <div class="mb-6">
        <h2 id="questionText" class="text-lg font-semibold mb-4 text-slate-800"></h2>
        <div id="optionsContainer" class="space-y-3"></div>
        
        <!-- ប្រអប់បង្ហាញចម្លើយត្រឹមត្រូវ -->
        <div id="explanationBox" class="hidden mt-4 p-4 bg-emerald-50 border border-emerald-300 rounded-xl">
          <span class="font-bold text-emerald-800 block mb-1">✅ ចម្លើយត្រឹមត្រូវ និងការពន្យល់៖</span>
          <div id="explanationText" class="text-emerald-900 text-sm"></div>
        </div>
      </div>

      <div class="flex justify-between border-t pt-4">
        <button onclick="prevQuestion()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg">ត្រឡប់ក្រោយ</button>
        <button onclick="toggleAnswer()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-semibold rounded-lg">
          👁️ មើលចម្លើយ
        </button>
        <button onclick="nextQuestion()" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg">បន្ទាប់</button>
      </div>
    </div>

    <!-- Mode 2: A4 Printable Worksheet View -->
    <div id="printContainer" class="hidden bg-white rounded-2xl shadow-md p-8 print-area">
      <div class="flex justify-between items-center border-b-2 border-slate-800 pb-4 mb-6">
        <div>
          <h1 id="printHeaderTitle" class="text-2xl font-bold text-slate-900"></h1>
          <p id="printHeaderSub" class="text-sm text-slate-600"></p>
        </div>
        <div class="text-right">
          <button onclick="window.print()" class="no-print bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-xl shadow mb-2">
            🖨️ បោះពុម្ពជា A4 (Print)
          </button>
          <div class="text-xs text-slate-500">ឈ្មោះសិស្ស៖....................................</div>
        </div>
      </div>

      <div id="allQuestionsList" class="space-y-6"></div>
    </div>
  </div>

  <script>
    let currentGradeData = null;
    let currentQuestions = [];
    let currentIndex = 0;
    let userAnswers = {};
    let timerInterval = null;

    async function loadGradeLessons() {
      const gradeVal = document.getElementById('gradeSelect').value;
      const lessonSelect = document.getElementById('lessonSelect');
      const statusMsg = document.getElementById('statusMessage');
      
      lessonSelect.innerHTML = '<option value="">កំពុងទាញយកមេរៀន...</option>';
      statusMsg.classList.add('hidden');

      try {
        const response = await fetch(`./grade${gradeVal}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP status ${response.status}`);
        
        currentGradeData = await response.json();
        
        lessonSelect.innerHTML = '';
        if (currentGradeData.lessons && currentGradeData.lessons.length > 0) {
          currentGradeData.lessons.forEach((lesson, index) => {
            lessonSelect.innerHTML += `<option value="${index}">${lesson.lesson_title}</option>`;
          });
        }
      } catch (error) {
        console.error("Error loading JSON file:", error);
        lessonSelect.innerHTML = '<option value="">មិនទាន់មានទិន្នន័យ</option>';
      }
    }

    function generate100Questions(sampleQuestions, testNo) {
      let questions = [];
      let baseSample = (sampleQuestions && sampleQuestions.length > 0) ? sampleQuestions[0] : null;

      for (let i = 1; i <= 100; i++) {
        if (baseSample) {
          questions.push({
            text: `[សំណួរទី ${i}] ${baseSample.question}`,
            options: baseSample.options,
            correct: baseSample.answer,
            explanation: baseSample.explanation || "គ្មានការពន្យល់"
          });
        } else {
          let a = i + (testNo * 2);
          let b = i + 3;
          questions.push({
            text: `គណនាតម្លៃនៃកន្សោម $x = ${a} + ${b}$`,
            options: [`$${a+b}$`, `$${a+b+1}$`, `$${a+b-1}$`, `$${a+b+2}$`],
            correct: 0,
            explanation: `ផលបូកគឺ ${a} + ${b} = ${a+b}`
          });
        }
      }
      return questions;
    }

    function startQuiz(mode) {
      const lessonSelect = document.getElementById('lessonSelect');
      if (!lessonSelect.value && lessonSelect.value !== "0") {
        alert("សូមជ្រើសរើសមេរៀនជាមុនសិន!");
        return;
      }

      const lessonIdx = parseInt(lessonSelect.value);
      const selectedLesson = currentGradeData.lessons[lessonIdx];
      const testNo = parseInt(document.getElementById('testNo').value) || 1;

      currentQuestions = generate100Questions(selectedLesson.sample_questions, testNo);

      if (mode === 'online') {
        document.getElementById('printContainer').classList.add('hidden');
        document.getElementById('quizContainer').classList.remove('hidden');
        document.getElementById('quizTitle').innerText = `${currentGradeData.title} - ${selectedLesson.lesson_title} (តេស្តទី ${testNo})`;
        currentIndex = 0;
        userAnswers = {};
        startTimer(30 * 60);
        renderQuestion();
      } else {
        // Mode Print A4
        document.getElementById('quizContainer').classList.add('hidden');
        document.getElementById('printContainer').classList.remove('hidden');
        document.getElementById('printHeaderTitle').innerText = `${currentGradeData.title} - ${selectedLesson.lesson_title}`;
        document.getElementById('printHeaderSub').innerText = `វិញ្ញាសាតេស្តទី ${testNo} (សរុប ១០០ សំណួរ / រយៈពេល ៣០ នាទី)`;
        renderA4Worksheet();
      }
    }

    function renderQuestion() {
      const q = currentQuestions[currentIndex];
      document.getElementById('currentQNum').innerText = currentIndex + 1;
      document.getElementById('questionText').innerHTML = q.text;
      document.getElementById('explanationBox').classList.add('hidden');

      const optsContainer = document.getElementById('optionsContainer');
      optsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const isSelected = userAnswers[currentIndex] === idx;
        optsContainer.innerHTML += `
          <label class="flex items-center p-3 border rounded-xl cursor-pointer ${isSelected ? 'border-indigo-600 bg-indigo-50' : 'border-slate-200 hover:bg-slate-50'}">
            <input type="radio" name="option" class="hidden" onclick="selectAnswer(${idx})" ${isSelected ? 'checked' : ''}>
            <span class="w-7 h-7 rounded-full border flex items-center justify-center mr-3 font-bold text-sm ${isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100'}">
              ${String.fromCharCode(65 + idx)}
            </span>
            <span>${opt}</span>
          </label>
        `;
      });

      renderMath();
    }

    function toggleAnswer() {
      const box = document.getElementById('explanationBox');
      const text = document.getElementById('explanationText');
      const q = currentQuestions[currentIndex];

      if (box.classList.contains('hidden')) {
        const correctLetter = String.fromCharCode(65 + q.correct);
        const correctOption = q.options[q.correct];
        text.innerHTML = `<b>ចម្លើយ៖ ${correctLetter}. ${correctOption}</b><br><b>ពន្យល់៖</b> ${q.explanation}`;
        box.classList.remove('hidden');
        renderMath();
      } else {
        box.classList.add('hidden');
      }
    }

    function renderA4Worksheet() {
      const list = document.getElementById('allQuestionsList');
      list.innerHTML = '';

      currentQuestions.forEach((q, i) => {
        let optionsHTML = q.options.map((opt, idx) => 
          `<span class="inline-block mr-6 font-medium">(${String.fromCharCode(65 + idx)}) ${opt}</span>`
        ).join('');

        list.innerHTML += `
          <div class="question-card p-4 border rounded-xl bg-slate-50">
            <p class="font-bold text-slate-900 mb-2">${q.text}</p>
            <div class="text-sm text-slate-700 mb-2">${optionsHTML}</div>
            <div class="text-xs text-emerald-700 bg-emerald-50 p-2 rounded border border-emerald-200">
              <b>ចម្លើយ៖</b> ${String.fromCharCode(65 + q.correct)} | <b>ពន្យល់៖</b> ${q.explanation}
            </div>
          </div>
        `;
      });

      renderMath();
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [{left: '$', right: '$', display: false}]
        });
      }
    }

    function selectAnswer(idx) {
      userAnswers[currentIndex] = idx;
      renderQuestion();
    }

    function nextQuestion() {
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      let timeRemaining = seconds;

      timerInterval = setInterval(() => {
        const min = Math.floor(timeRemaining / 60);
        const sec = timeRemaining % 60;
        document.getElementById('timer').innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          alert('អស់ချိန်ធ្វើតេស្ត!');
        }
        timeRemaining--;
      }, 1000);
    }

    window.onload = loadGradeLessons;
  </script>
</body>
</html>
