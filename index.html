<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ប្រព័ន្ធតេស្ត និងបោះពុម្ព A4</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX for Rendering Math -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap');
    body { font-family: 'Kantumruy Pro', sans-serif; }

    @media print {
      .no-print { display: none !important; }
      body { background-color: white; color: black; }
      .print-area { shadow: none; border: none; padding: 0; width: 100%; }
      .question-card { break-inside: avoid; border: 1px solid #ccc !important; margin-bottom: 12px !important; page-break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <div class="max-w-4xl mx-auto p-4">
    <!-- Header Selection -->
    <div class="bg-white rounded-2xl shadow-md p-6 mb-6 no-print">
      <h1 class="text-2xl font-bold text-indigo-700 text-center mb-6">ប្រព័ន្ធបង្កើតវិញ្ញាសា A4 (សិស្ស & គ្រូ)</h1>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-sm font-semibold mb-1">១. ជ្រើសរើសថ្នាក់៖</label>
          <select id="gradeSelect" class="w-full border rounded-xl p-2.5 bg-slate-50" onchange="loadGradeLessons()">
            <option value="12">ថ្នាក់ទី ១២</option>
            <option value="11">ថ្នាក់ទី ១១</option>
            <option value="10">ថ្នាក់ទី ១០</option>
            <option value="9">ថ្នាក់ទី ៩</option>
            <option value="8">ថ្នាក់ទី ៨</option>
            <option value="7">ថ្នាក់ទី ៧</option>
            <option value="6">ថ្នាក់ទី ៦</option>
            <option value="5">ថ្នាក់ទី ៥</option>
            <option value="4">ថ្នាក់ទី ៤</option>
            <option value="3">ថ្នាក់ទី ៣</option>
            <option value="2">ថ្នាក់ទី ២</option>
            <option value="1">ថ្នាក់ទី ១</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">២. ជ្រើសរើសមេរៀន៖</label>
          <select id="lessonSelect" class="w-full border rounded-xl p-2.5 bg-slate-50">
            <option value="">កំពុងទាញយកមេរៀន...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">៣. លេខតេស្ត (១-១០០)៖</label>
          <input type="number" id="testNo" value="1" min="1" max="100" class="w-full border rounded-xl p-2.5 bg-slate-50">
        </div>
      </div>

      <!-- ប៊ូតុងជ្រើសរើសទម្រង់ Print -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <button onclick="generateA4('student')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">
          👨‍🎓 មើលទម្រង់ A4 សម្រាប់សិស្ស (គ្មានចម្លើយ)
        </button>
        <button onclick="generateA4('teacher')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition">
          👨‍🏫 មើលទម្រង់ A4 សម្រាប់គ្រូកែ (មានចម្លើយ A B C D)
        </button>
      </div>
    </div>

    <!-- A4 Printable Area -->
    <div id="printContainer" class="hidden bg-white rounded-2xl shadow-md p-8 print-area">
      <div class="flex justify-between items-center border-b-2 border-slate-800 pb-4 mb-6">
        <div>
          <h1 id="printHeaderTitle" class="text-2xl font-bold text-slate-900"></h1>
          <p id="printHeaderSub" class="text-sm text-slate-600"></p>
        </div>
        <div class="text-right">
          <button onclick="window.print()" class="no-print bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2 rounded-xl shadow mb-2">
            🖨️ បោះពុម្ព (Print / PDF)
          </button>
          <div id="studentInfo" class="text-xs text-slate-600 font-semibold">ឈ្មោះសិស្ស៖.................................................</div>
        </div>
      </div>

      <div id="allQuestionsList" class="space-y-4"></div>
    </div>
  </div>

  <script>
    let currentGradeData = null;
    let currentQuestions = [];

    async function loadGradeLessons() {
      const gradeVal = document.getElementById('gradeSelect').value;
      const lessonSelect = document.getElementById('lessonSelect');

      try {
        const response = await fetch(`./grade${gradeVal}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP status ${response.status}`);
        
        currentGradeData = await response.json();
        lessonSelect.innerHTML = '';
        if (currentGradeData.lessons && currentGradeData.lessons.length > 0) {
          currentGradeData.lessons.forEach((lesson, index) => {
            lessonSelect.innerHTML += `<option value="${index}">${lesson.lesson_title}</option>`;
          });
        }
      } catch (error) {
        console.error("Error loading JSON file:", error);
        lessonSelect.innerHTML = '<option value="">មិនទាន់មានទិន្នន័យ</option>';
      }
    }

    // បង្កើតសំណួរដោយកំណត់ចម្លើយត្រឹមត្រូវឱ្យឆ្លាស់គ្នា A, B, C, D (0, 1, 2, 3) ស្វ័យប្រវត្តិ
    function generate100Questions(sampleQuestions, testNo) {
      let questions = [];
      let baseSample = (sampleQuestions && sampleQuestions.length > 0) ? sampleQuestions[0] : null;

      for (let i = 1; i <= 100; i++) {
        // ចម្លើយត្រឹមត្រូវឆ្លាស់គ្នា A=0, B=1, C=2, D=3, A=0...
        let correctIndex = (i - 1) % 4; 

        if (baseSample) {
          questions.push({
            text: `[សំណួរទី ${i}] ${baseSample.question}`,
            options: baseSample.options,
            correct: correctIndex,
            explanation: baseSample.explanation || "គណនាតាមរូបមន្តមេរៀន"
          });
        } else {
          let a = i + (testNo * 2);
          let b = i + 3;
          let sum = a + b;
          
          // បង្កើតជម្រើសចម្លើយ ៤ ដោយដាក់ចម្លើយត្រូវចំទីតាំង correctIndex
          let opts = [];
          opts[correctIndex] = `$${sum}$`;
          opts[(correctIndex + 1) % 4] = `$${sum + 1}$`;
          opts[(correctIndex + 2) % 4] = `$${sum - 1}$`;
          opts[(correctIndex + 3) % 4] = `$${sum + 2}$`;

          questions.push({
            text: `គណនាតម្លៃនៃកន្សោម $x = ${a} + ${b}$`,
            options: opts,
            correct: correctIndex,
            explanation: `ផលបូកគឺ ${a} + ${b} = ${sum}`
          });
        }
      }
      return questions;
    }

    function generateA4(role) {
      const lessonSelect = document.getElementById('lessonSelect');
      if (!lessonSelect.value && lessonSelect.value !== "0") {
        alert("សូមជ្រើសរើសមេរៀនជាមុនសិន!");
        return;
      }

      const lessonIdx = parseInt(lessonSelect.value);
      const selectedLesson = currentGradeData.lessons[lessonIdx];
      const testNo = parseInt(document.getElementById('testNo').value) || 1;

      currentQuestions = generate100Questions(selectedLesson.sample_questions, testNo);

      document.getElementById('printContainer').classList.remove('hidden');
      document.getElementById('printHeaderTitle').innerText = `${currentGradeData.title} - ${selectedLesson.lesson_title}`;

      const list = document.getElementById('allQuestionsList');
      list.innerHTML = '';

      if (role === 'student') {
        // ទម្រង់សម្រាប់សិស្ស (គ្មានចម្លើយ)
        document.getElementById('printHeaderSub').innerText = `សន្លឹកកិច្ចការសិស្ស - តេស្តទី ${testNo} (សរុប ១០០ សំណួរ)`;
        document.getElementById('studentInfo').style.display = 'block';

        currentQuestions.forEach((q, i) => {
          let optionsHTML = q.options.map((opt, idx) => 
            `<span class="inline-block mr-8 font-medium">(${String.fromCharCode(65 + idx)}) ${opt}</span>`
          ).join('');

          list.innerHTML += `
            <div class="question-card p-3 border rounded-xl bg-slate-50">
              <p class="font-semibold text-slate-900 mb-1.5">${q.text}</p>
              <div class="text-sm text-slate-700">${optionsHTML}</div>
            </div>
          `;
        });
      } else {
        // ទម្រង់សម្រាប់គ្រូ (មានចម្លើយ ឆ្លាស់គ្នា A B C D និងការពន្យល់)
        document.getElementById('printHeaderSub').innerText = `សន្លឹកកំណែគ្រូ - តេស្តទី ${testNo} (ចម្លើយឆ្លាស់គ្នា A B C D)`;
        document.getElementById('studentInfo').style.display = 'none';

        currentQuestions.forEach((q, i) => {
          let optionsHTML = q.options.map((opt, idx) => {
            const isCorrect = (idx === q.correct);
            return `<span class="inline-block mr-6 font-medium ${isCorrect ? 'text-emerald-700 font-bold bg-emerald-100 px-2 py-0.5 rounded' : ''}">
              (${String.fromCharCode(65 + idx)}) ${opt}
            </span>`;
          }).join('');

          list.innerHTML += `
            <div class="question-card p-3 border border-emerald-300 rounded-xl bg-emerald-50/40">
              <p class="font-semibold text-slate-900 mb-1.5">${q.text}</p>
              <div class="text-sm text-slate-700 mb-2">${optionsHTML}</div>
              <div class="text-xs text-emerald-800 bg-emerald-100 p-2 rounded border border-emerald-300">
                <b>ចម្លើយត្រឹមត្រូវ៖</b> ${String.fromCharCode(65 + q.correct)} | <b>ពន្យល់៖</b> ${q.explanation}
              </div>
            </div>
          `;
        });
      }

      renderMath();
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.getElementById('printContainer'), {
          delimiters: [{left: '$', right: '$', display: false}]
        });
      }
    }

    window.onload = loadGradeLessons;
  </script>
</body>
</html>
