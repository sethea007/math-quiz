<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ប្រព័ន្ធតេស្ត និងបោះពុម្ពវិញ្ញាសា A4</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX for Rendering Math -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap');
    body { font-family: 'Kantumruy Pro', sans-serif; }

    @media print {
      .no-print { display: none !important; }
      body { background-color: white; color: black; }
      .print-area { shadow: none; border: none; padding: 0; width: 100%; }
      .question-card { break-inside: avoid; border: 1px solid #ccc !important; margin-bottom: 12px !important; page-break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <div class="max-w-4xl mx-auto p-4">
    <!-- Control Panel / Header Selection -->
    <div class="bg-white rounded-2xl shadow-md p-6 mb-6 no-print">
      <h1 class="text-2xl font-bold text-indigo-700 text-center mb-6">ប្រព័ន្ធគ្រប់គ្រងការតេស្ត និងបោះពុម្ពវិញ្ញាសា</h1>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div>
          <label class="block text-sm font-semibold mb-1">១. ជ្រើសរើសថ្នាក់៖</label>
          <select id="gradeSelect" class="w-full border rounded-xl p-2.5 bg-slate-50" onchange="loadGradeLessons()">
            <option value="12">ថ្នាក់ទី ១២</option>
            <option value="11">ថ្នាក់ទី ១១</option>
            <option value="10">ថ្នាក់ទី ១០</option>
            <option value="9">ថ្នាក់ទី ៩</option>
            <option value="8">ថ្នាក់ទី ៨</option>
            <option value="7">ថ្នាក់ទី ៧</option>
            <option value="6">ថ្នាក់ទី ៦</option>
            <option value="5">ថ្នាក់ទី ៥</option>
            <option value="4">ថ្នាក់ទី ៤</option>
            <option value="3">ថ្នាក់ទី ៣</option>
            <option value="2">ថ្នាក់ទី ២</option>
            <option value="1">ថ្នាក់ទី ១</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">២. ជ្រើសរើសមេរៀន៖</label>
          <select id="lessonSelect" class="w-full border rounded-xl p-2.5 bg-slate-50">
            <option value="">កំពុងទាញយកមេរៀន...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">៣. លេខតេស្ត (១-១០០)៖</label>
          <input type="number" id="testNo" value="1" min="1" max="100" class="w-full border rounded-xl p-2.5 bg-slate-50">
        </div>
      </div>

      <!-- ៤ ប៊ូតុងមេ (4 Main Buttons) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <button onclick="startOnlineTest()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
          💻 ផ្លូវទី១៖ ធ្វើតេស្តលើ System (Online)
        </button>
        <button onclick="printStudentWorksheet()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
          🖨️ ផ្លូវទី២៖ Print លំហាត់សិស្ស A4 (គ្មានចម្លើយ)
        </button>
        <button onclick="printTeacherKey()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
          👨‍🏫 ផ្លូវទី៣៖ Print សន្លឹកកំណែគ្រូ A4 (មានចម្លើយ A B C D)
        </button>
        <button onclick="printStudentResult()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
          📄 ផ្លូវទី៤៖ Print លទ្ធផលដែលសិស្សធ្វើរួច
        </button>
      </div>
    </div>

    <!-- Mode 1: Interactive Online Quiz -->
    <div id="quizContainer" class="hidden bg-white rounded-2xl shadow-md p-6 no-print mb-6">
      <div class="flex justify-between items-center border-b pb-4 mb-4">
        <div>
          <span id="quizTitle" class="font-bold text-lg text-indigo-700 block"></span>
          <p class="text-sm text-slate-500">សំណួរទី <span id="currentQNum" class="font-bold">1</span> / 100</p>
        </div>
        <div class="bg-red-50 border border-red-200 rounded-lg px-4 py-1 text-right">
          <span class="text-xs text-red-500 block">ពេលនៅសល់</span>
          <span id="timer" class="text-xl font-bold text-red-600 font-mono">30:00</span>
        </div>
      </div>

      <div class="mb-6">
        <h2 id="questionText" class="text-lg font-semibold mb-4 text-slate-800"></h2>
        <div id="optionsContainer" class="space-y-3"></div>
      </div>

      <div class="flex justify-between border-t pt-4">
        <button onclick="prevQuestion()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg">ត្រឡប់ក្រោយ</button>
        <button onclick="nextQuestion()" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg">បន្ទាប់</button>
      </div>
    </div>

    <!-- Mode 2, 3, 4: Printable A4 Container -->
    <div id="printContainer" class="hidden bg-white rounded-2xl shadow-md p-8 print-area">
      <div class="flex justify-between items-center border-b-2 border-slate-800 pb-4 mb-6">
        <div>
          <h1 id="printHeaderTitle" class="text-2xl font-bold text-slate-900"></h1>
          <p id="printHeaderSub" class="text-sm text-slate-600"></p>
        </div>
        <div class="text-right">
          <button onclick="window.print()" class="no-print bg-slate-800 hover:bg-slate-900 text-white font-bold px-5 py-2 rounded-xl shadow mb-2">
            🖨️ ចុចបោះពុម្ព (Print / Save PDF)
          </button>
          <div id="studentInfoBox" class="text-xs text-slate-700 font-semibold">
            ឈ្មោះសិស្ស៖.................................................
          </div>
        </div>
      </div>

      <div id="allQuestionsList" class="space-y-4"></div>
    </div>
  </div>

  <script>
    let currentGradeData = null;
    let currentQuestions = [];
    let currentIndex = 0;
    let userAnswers = {};
    let timerInterval = null;

    async function loadGradeLessons() {
      const gradeVal = document.getElementById('gradeSelect').value;
      const lessonSelect = document.getElementById('lessonSelect');

      try {
        const response = await fetch(`./grade${gradeVal}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP status ${response.status}`);
        
        currentGradeData = await response.json();
        lessonSelect.innerHTML = '';
        if (currentGradeData.lessons && currentGradeData.lessons.length > 0) {
          currentGradeData.lessons.forEach((lesson, index) => {
            lessonSelect.innerHTML += `<option value="${index}">${lesson.lesson_title}</option>`;
          });
        }
      } catch (error) {
        console.error("Error loading JSON file:", error);
        lessonSelect.innerHTML = '<option value="">មិនទាន់មានទិន្នន័យ</option>';
      }
    }

    // បង្កើត 100 សំណួរ ដោយកំណត់ចម្លើយឱ្យឆ្លាស់គ្នា A, B, C, D (0, 1, 2, 3)
    function generate100Questions(sampleQuestions, testNo) {
      let questions = [];
      let baseSample = (sampleQuestions && sampleQuestions.length > 0) ? sampleQuestions[0] : null;

      for (let i = 1; i <= 100; i++) {
        let correctIndex = (i - 1) % 4; // A, B, C, D ឆ្លាស់គ្នារហូត

        if (baseSample) {
          questions.push({
            text: `[សំណួរទី ${i}] ${baseSample.question}`,
            options: baseSample.options,
            correct: correctIndex,
            explanation: baseSample.explanation || "គណនាតាមរូបមន្តមេរៀន"
          });
        } else {
          let a = i + (testNo * 2);
          let b = i + 3;
          let sum = a + b;
          
          let opts = [];
          opts[correctIndex] = `$${sum}$`;
          opts[(correctIndex + 1) % 4] = `$${sum + 1}$`;
          opts[(correctIndex + 2) % 4] = `$${sum - 1}$`;
          opts[(correctIndex + 3) % 4] = `$${sum + 2}$`;

          questions.push({
            text: `គណនាតម្លៃនៃកន្សោម $x = ${a} + ${b}$`,
            options: opts,
            correct: correctIndex,
            explanation: `ផលបូកគឺ ${a} + ${b} = ${sum}`
          });
        }
      }
      return questions;
    }

    function initQuestions() {
      const lessonSelect = document.getElementById('lessonSelect');
      if (!lessonSelect.value && lessonSelect.value !== "0") {
        alert("សូមជ្រើសរើសមេរៀនជាមុនសិន!");
        return false;
      }

      const lessonIdx = parseInt(lessonSelect.value);
      const selectedLesson = currentGradeData.lessons[lessonIdx];
      const testNo = parseInt(document.getElementById('testNo').value) || 1;

      currentQuestions = generate100Questions(selectedLesson.sample_questions, testNo);
      return { selectedLesson, testNo };
    }

    // ប៊ូតុងទី១៖ ធ្វើតេស្តលើ System
    function startOnlineTest() {
      const data = initQuestions();
      if (!data) return;

      document.getElementById('printContainer').classList.add('hidden');
      document.getElementById('quizContainer').classList.remove('hidden');
      document.getElementById('quizTitle').innerText = `${currentGradeData.title} - ${data.selectedLesson.lesson_title} (តេស្តទី ${data.testNo})`;
      
      currentIndex = 0;
      userAnswers = {};
      startTimer(30 * 60);
      renderQuestion();
    }

    function renderQuestion() {
      const q = currentQuestions[currentIndex];
      document.getElementById('currentQNum').innerText = currentIndex + 1;
      document.getElementById('questionText').innerHTML = q.text;

      const optsContainer = document.getElementById('optionsContainer');
      optsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const isSelected = userAnswers[currentIndex] === idx;
        optsContainer.innerHTML += `
          <label class="flex items-center p-3 border rounded-xl cursor-pointer ${isSelected ? 'border-indigo-600 bg-indigo-50' : 'border-slate-200 hover:bg-slate-50'}">
            <input type="radio" name="option" class="hidden" onclick="selectAnswer(${idx})" ${isSelected ? 'checked' : ''}>
            <span class="w-7 h-7 rounded-full border flex items-center justify-center mr-3 font-bold text-sm ${isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100'}">
              ${String.fromCharCode(65 + idx)}
            </span>
            <span>${opt}</span>
          </label>
        `;
      });

      renderMath();
    }

    function selectAnswer(idx) {
      userAnswers[currentIndex] = idx;
      renderQuestion();
    }

    // ប៊ូតុងទី២៖ Print លំហាត់សិស្ស A4
    function printStudentWorksheet() {
      const data = initQuestions();
      if (!data) return;

      document.getElementById('quizContainer').classList.add('hidden');
      document.getElementById('printContainer').classList.remove('hidden');
      
      document.getElementById('printHeaderTitle').innerText = `${currentGradeData.title} - ${data.selectedLesson.lesson_title}`;
      document.getElementById('printHeaderSub').innerText = `វិញ្ញាសាលំហាត់សិស្ស - តេស្តទី ${data.testNo} (សរុប ១០០ សំណួរ)`;
      document.getElementById('studentInfoBox').innerHTML = 'ឈ្មោះសិស្ស៖.................................................';

      const list = document.getElementById('allQuestionsList');
      list.innerHTML = '';

      currentQuestions.forEach((q) => {
        let optionsHTML = q.options.map((opt, idx) => 
          `<span class="inline-block mr-8 font-medium">(${String.fromCharCode(65 + idx)}) ${opt}</span>`
        ).join('');

        list.innerHTML += `
          <div class="question-card p-3 border rounded-xl bg-slate-50">
            <p class="font-semibold text-slate-900 mb-1 border-b pb-1">${q.text}</p>
            <div class="text-sm text-slate-700 mt-2">${optionsHTML}</div>
          </div>
        `;
      });

      renderMath();
    }

    // ប៊ូតុងទី៣៖ Print សន្លឹកកំណែគ្រូ A4
    function printTeacherKey() {
      const data = initQuestions();
      if (!data) return;

      document.getElementById('quizContainer').classList.add('hidden');
      document.getElementById('printContainer').classList.remove('hidden');
      
      document.getElementById('printHeaderTitle').innerText = `${currentGradeData.title} - ${data.selectedLesson.lesson_title}`;
      document.getElementById('printHeaderSub').innerText = `សន្លឹកកំណែគ្រូ - តេស្តទី ${data.testNo} (ចម្លើយឆ្លាស់គ្នា A, B, C, D)`;
      document.getElementById('studentInfoBox').innerHTML = '<span class="text-emerald-700 font-bold">ឯកសារកំណែគ្រូ</span>';

      const list = document.getElementById('allQuestionsList');
      list.innerHTML = '';

      currentQuestions.forEach((q) => {
        let optionsHTML = q.options.map((opt, idx) => {
          const isCorrect = (idx === q.correct);
          return `<span class="inline-block mr-6 font-medium ${isCorrect ? 'text-emerald-700 font-bold bg-emerald-100 px-2 py-0.5 rounded border border-emerald-400' : ''}">
            (${String.fromCharCode(65 + idx)}) ${opt}
          </span>`;
        }).join('');

        list.innerHTML += `
          <div class="question-card p-3 border border-emerald-300 rounded-xl bg-emerald-50/30">
            <p class="font-semibold text-slate-900 mb-1 border-b border-emerald-200 pb-1">${q.text}</p>
            <div class="text-sm text-slate-700 my-2">${optionsHTML}</div>
            <div class="text-xs text-emerald-800 bg-emerald-100 p-2 rounded border border-emerald-300">
              <b>ចម្លើយត្រឹមត្រូវ៖</b> ${String.fromCharCode(65 + q.correct)} | <b>ពន្យល់៖</b> ${q.explanation}
            </div>
          </div>
        `;
      });

      renderMath();
    }

    // ប៊ូតុងទី៤៖ Print លទ្ធផលដែលសិស្សធ្វើរួច
    function printStudentResult() {
      if (!currentQuestions || currentQuestions.length === 0 || Object.keys(userAnswers).length === 0) {
        alert("សូមឱ្យសិស្សធ្វើតេស្តលើ System (ផ្លូវទី១) ឱ្យបានខ្លះជាមុនសិន!");
        return;
      }

      document.getElementById('quizContainer').classList.add('hidden');
      document.getElementById('printContainer').classList.remove('hidden');

      // គណនាពិន្ទុ
      let score = 0;
      currentQuestions.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) score++;
      });

      document.getElementById('printHeaderTitle').innerText = `លទ្ធផលធ្វើតេស្តរបស់សិស្ស`;
      document.getElementById('printHeaderSub').innerText = `កាលបរិច្ឆេទតេស្ត៖ ${new Date().toLocaleDateString('km-KH')}`;
      document.getElementById('studentInfoBox').innerHTML = `<span class="text-indigo-700 font-bold text-sm">ពិន្ទទទួលបាន៖ ${score} / 100</span>`;

      const list = document.getElementById('allQuestionsList');
      list.innerHTML = '';

      currentQuestions.forEach((q, idx) => {
        const userAns = userAnswers[idx];
        const isAnswered = userAns !== undefined;
        const isCorrect = userAns === q.correct;

        let optionsHTML = q.options.map((opt, optIdx) => {
          let style = "text-slate-700";
          if (optIdx === q.correct) style = "text-emerald-700 font-bold bg-emerald-100 px-2 py-0.5 rounded"; // ចម្លើយត្រូវ
          if (isAnswered && optIdx === userAns && !isCorrect) style = "text-red-700 font-bold bg-red-100 px-2 py-0.5 rounded line-through"; // ចម្លើយសិស្សរើសខុស

          return `<span class="inline-block mr-6 font-medium ${style}">
            (${String.fromCharCode(65 + optIdx)}) ${opt}
          </span>`;
        }).join('');

        list.innerHTML += `
          <div class="question-card p-3 border rounded-xl ${isCorrect ? 'bg-emerald-50/20 border-emerald-200' : 'bg-red-50/20 border-red-200'}">
            <div class="flex justify-between items-center mb-1 border-b pb-1">
              <p class="font-semibold text-slate-900">${q.text}</p>
              <span class="text-xs font-bold px-2 py-0.5 rounded ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">
                ${isCorrect ? '✅ ត្រឹមត្រូវ' : (isAnswered ? '❌ ខុស' : '⚠️ មិនបានឆ្លើយ')}
              </span>
            </div>
            <div class="text-sm text-slate-700 my-2">${optionsHTML}</div>
          </div>
        `;
      });

      renderMath();
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [{left: '$', right: '$', display: false}]
        });
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) { currentIndex--; renderQuestion(); }
    }

    function nextQuestion() {
      if (currentIndex < currentQuestions.length - 1) { currentIndex++; renderQuestion(); }
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      let timeRemaining = seconds;
      timerInterval = setInterval(() => {
        const min = Math.floor(timeRemaining / 60);
        const sec = timeRemaining % 60;
        document.getElementById('timer').innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        if (timeRemaining <= 0) { clearInterval(timerInterval); alert('អស់ချိန်ធ្វើតេស្ត!'); }
        timeRemaining--;
      }, 1000);
    }

    window.onload = loadGradeLessons;
  </script>
</body>
</html>
