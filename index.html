<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ប្រព័ន្ធតេស្តគណិតវិទ្យា (១០០ សំណួរ / ៣០នាទី)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX for rendering Math Formulas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <div class="max-w-4xl mx-auto p-4">
    <!-- Header / Control Panel -->
    <div class="bg-white rounded-xl shadow-md p-6 mb-6">
      <h1 class="text-2xl font-bold text-indigo-600 mb-4">ប្រព័ន្ធស្ទង់សមត្ថភាពគណិតវិទ្យា</h1>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium mb-1">ជ្រើសរើសថ្នាក់៖</label>
          <select id="gradeSelect" class="w-full border rounded-lg p-2" onchange="loadLessons()">
            <option value="12">ថ្នាក់ទី ១២</option>
            <option value="11">ថ្នាក់ទី ១១</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">ជ្រើសរើសមេរៀន៖</label>
          <select id="lessonSelect" class="w-full border rounded-lg p-2"></select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">ជ្រើសរើសលេខតេស្ត (១-១០០)៖</label>
          <input type="number" id="testNo" value="1" min="1" max="100" class="w-full border rounded-lg p-2">
        </div>
      </div>

      <button onclick="startQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition">
        ចាប់ផ្តើមធ្វើតេស្ត (១០០ សំណួរ / ៣០នាទី)
      </button>
    </div>

    <!-- Quiz Area -->
    <div id="quizContainer" class="hidden bg-white rounded-xl shadow-md p-6">
      <!-- Quiz Header -->
      <div class="flex justify-between items-center border-b pb-4 mb-4">
        <div>
          <span id="quizTitle" class="font-bold text-lg text-indigo-600"></span>
          <p class="text-sm text-gray-500">សំណួរទី <span id="currentQNum">1</span> / 100</p>
        </div>
        <div class="text-right">
          <span class="text-xs text-gray-500 block">ពេលនៅសល់</span>
          <span id="timer" class="text-xl font-bold text-red-500">30:00</span>
        </div>
      </div>

      <!-- Question Content -->
      <div class="mb-6">
        <h2 id="questionText" class="text-lg font-medium mb-4"></h2>
        <div id="optionsContainer" class="space-y-3"></div>
      </div>

      <!-- Navigation Buttons -->
      <div class="flex justify-between pt-4 border-t">
        <button onclick="prevQuestion()" class="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">ត្រឡប់ក្រោយ</button>
        <button onclick="nextQuestion()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">បន្ទាប់</button>
      </div>
    </div>
  </div>

  <script>
    // ទិន្នន័យមេរៀនតាមថ្នាក់
    const curriculumData = {
      12: [
        { id: 'g12_cplx', name: 'ចំនួនកុំផ្លិច' },
        { id: 'g12_lim', name: 'លីមីតនៃអនុគមន៍' },
        { id: 'g12_integ', name: 'អាំងតេក្រាល' }
      ],
      11: [
        { id: 'g11_trig', name: 'ត្រីកោណមាត្រ' }
      ]
    };

    let currentQuestions = [];
    let currentIndex = 0;
    let userAnswers = {};
    let timerInterval = null;

    // Load Lessons dropdown
    function loadLessons() {
      const grade = document.getElementById('gradeSelect').value;
      const lessonSelect = document.getElementById('lessonSelect');
      lessonSelect.innerHTML = '';
      curriculumData[grade].forEach(lesson => {
        lessonSelect.innerHTML += `<option value="${lesson.id}">${lesson.name}</option>`;
      });
    }

    // Dynamic Math Question Generator (បង្កើត ១០០ សំណួរស្វ័យប្រវត្តិ)
    function generateQuestions(lessonId, testNo) {
      const questions = [];
      const seed = testNo * 100; // ដកស្រង់ក្បួនលេខតាមលេខតេស្ត

      for (let i = 1; i <= 100; i++) {
        let a = (i + seed) % 10 + 1;
        let b = (i * 2 + seed) % 10 + 1;
        
        if (lessonId === 'g12_cplx') {
          // គំរូសំណួរចំនួនកុំផ្លិច
          let ans = Math.sqrt(a*a + b*b).toFixed(2);
          questions.push({
            id: i,
            text: `រកម៉ូឌុលនៃចំនួនកុំផ្លិច $z = ${a} + ${b}i$`,
            options: [`${ans}`, `${a + b}`, `${a * b}`, `${(a*a + b*b)}`],
            correct: 0,
            explanation: `|z| = \\sqrt{${a}^2 + ${b}^2} = ${ans}`
          });
        } else {
          // គំរូសំណួរបូកលេខទូទៅ
          questions.push({
            id: i,
            text: `គណនាតម្លៃនៃ $x = ${a} + ${b}$`,
            options: [`${a + b}`, `${a - b}`, `${a * b}`, `${a + b + 1}`],
            correct: 0,
            explanation: `${a} + ${b} = ${a + b}`
          });
        }
      }
      return questions;
    }

    // ចាប់ផ្តើមធ្វើតេស្ត
    function startQuiz() {
      const lessonId = document.getElementById('lessonSelect').value;
      const testNo = parseInt(document.getElementById('testNo').value);
      
      currentQuestions = generateQuestions(lessonId, testNo);
      currentIndex = 0;
      userAnswers = {};

      document.getElementById('quizContainer').classList.remove('hidden');
      document.getElementById('quizTitle').innerText = `តេស្តទី ${testNo} (១០០ សំណួរ)`;
      
      startTimer(30 * 60); // ៣០ នាទី
      renderQuestion();
    }

    // បង្ហាញសំណួរតាម Index
    function renderQuestion() {
      const q = currentQuestions[currentIndex];
      document.getElementById('currentQNum').innerText = currentIndex + 1;
      document.getElementById('questionText').innerHTML = q.text;

      const optsContainer = document.getElementById('optionsContainer');
      optsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const isSelected = userAnswers[currentIndex] === idx;
        optsContainer.innerHTML += `
          <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-slate-50 ${isSelected ? 'border-indigo-600 bg-indigo-50' : ''}">
            <input type="radio" name="option" class="hidden" onclick="selectAnswer(${idx})" ${isSelected ? 'checked' : ''}>
            <span class="w-7 h-7 rounded-full border flex items-center justify-center mr-3 font-semibold text-sm ${isSelected ? 'bg-indigo-600 text-white' : 'bg-gray-100'}">
              ${String.fromCharCode(65 + idx)}
            </span>
            <span>${opt}</span>
          </label>
        `;
      });

      // Render KaTeX Formulas
      if (window.renderMathInElement) {
        renderMathInElement(document.getElementById('quizContainer'));
      }
    }

    function selectAnswer(idx) {
      userAnswers[currentIndex] = idx;
      renderQuestion();
    }

    function nextQuestion() {
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    // នាឡិការ៉ាប់ថយក្រោយ ៣០ នាទី
    function startTimer(seconds) {
      clearInterval(timerInterval);
      let timeRemaining = seconds;
      
      timerInterval = setInterval(() => {
        const min = Math.floor(timeRemaining / 60);
        const sec = timeRemaining % 60;
        document.getElementById('timer').innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          alert('អស់ချိန်ធ្វើតេស្តហើយ!');
        }
        timeRemaining--;
      }, 1000);
    }

    // Init
    loadLessons();
  </script>
</body>
</html>
